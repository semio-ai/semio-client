name: Publish semio-studio-auth

on:
  push:
    tags: ["semio-studio-auth-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify the crate without uploading it; unchecked, publish the selected ref's version
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A tag names the version it publishes: semio-studio-auth-v0.1.0 publishes
      # 0.1.0, and a tag that disagrees with the manifest publishes nothing.
      - name: Check the tag against the manifest
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "semio-studio-auth") | .version')
          if [ "semio-studio-auth-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match semio-studio-auth $version"
            exit 1
          fi
      - run: cargo test -p semio-studio-auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish -p semio-studio-auth --dry-run
          else
            cargo publish -p semio-studio-auth
          fi
