query GetPublicQuery($id: UUID!) {
  enumeration {
    getPublic(id: $id) {
      __typename
      parent
      name
      variants {
        id
        variant {
          __typename
          name
          type {
            __typename
            ... on Primitive {
              kind
            }
            ... on UnfrozenScalar {
              reference {
                __typename
                id
                versionReq
              }
            }
            ... on UnfrozenArray {
              reference {
                __typename
                id
                versionReq
              }
            }
          }
        }
      }
    }
  }
}