query GetVersionPrivateQuery($id: UUID!, $version: Int!) {
  enumeration {
    getVersionPrivate(id: $id, version: $version) {
      __typename
      parent
      name
      acl {
        permissions {
          __typename
          id
          withPermissions {
            __typename
            ... on Inherit {
              from
            }
            ... on Permissions {
              read
              write
            }
          }
        }
        default {
          __typename
          ... on Inherit {
            from
          }
          ... on Permissions {
            read
            write
          }
        }
      }
      variants {
        id
        variant {
          __typename
          name
          type {
            __typename
            ... on Primitive {
              kind
            }
            ... on UnfrozenScalar {
              reference {
                __typename
                id
                versionReq
              }
            }
            ... on UnfrozenArray {
              reference {
                __typename
                id
                versionReq
              }
            }
          }
        }
      }
    }
  }
}