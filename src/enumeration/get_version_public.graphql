query GetVersionPublicQuery($id: UUID!, $version: Int!) {
  enumeration {
    getVersionPublic(id: $id, version: $version) {
      __typename
      parent
      name
      variants {
        id
        variant {
          __typename
          name
          type {
            __typename
            ... on Primitive {
              kind
            }
            ... on UnfrozenScalar {
              reference {
                __typename
                id
                versionReq
              }
            }
            ... on UnfrozenArray {
              reference {
                __typename
                id
                versionReq
              }
            }
          }
        }
      }
    }
  }
}