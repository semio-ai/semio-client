query TaggedReqQuery($id: Uuid!, $versionReq: String!) {
  enumeration {
    taggedReq(id: $id, versionReq: $versionReq) {
      __typename
      parent
      name
      variants {
        __typename
        id
        variant {
          __typename
          name
          type {
            __typename
            ... on Primitive {
              kind
            }
            ... on FrozenScalar {
              reference {
                __typename
                id
                version
              }
            }
            ... on FrozenArray {
              reference {
                __typename
                id
                version
              }
            }
          }
        }
      }
    }
  }
}