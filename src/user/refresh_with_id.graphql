mutation RefreshWithIdQuery($id: UUID!, $refreshToken: String!) {
  user {
    refreshWithId(id: $id, refreshToken: $refreshToken) {
      access {
        token
        expiresAt
      }
      refresh {
        token
        expiresAt
      }
      id
      user {
        userName
        email
        firstName
        lastName
        emailVerified
      }
    }
  }
}